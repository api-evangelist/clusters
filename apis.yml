aid: clusters
name: Clusters
description: >-
  Clusters is a multichain namespace and identity service that gives users a
  single universal name across blockchain ecosystems instead of a separate
  domain per chain. A Clusters name uses the format username/wallet (for example
  username/eth or username/sol) to bundle many wallets — EVM chains, Solana, and
  more — under one hierarchical, human-readable profile. The Clusters v1 REST API
  resolves an address to its cluster and wallet name and back, reads full cluster
  profiles, checks name availability, produces on-chain registration transaction
  data for EVM and Solana, registers community cluster names, and exposes a
  replayable historical event feed for permissionless indexing. Reads are public;
  wallet management and registration require a wallet-signature bearer token, and
  an optional API key raises rate limits. The protocol uses a hub-and-spoke model
  bridged with LayerZero v2 and replicates metadata to Arweave for data
  availability. Backed by Electric Capital.
